# Production: builds the app and copies it to barteron.club. For now it runs only from main,
# and main of pocketnetteam/barteron.gui holds the old app's workflow, so this file deploys
# nothing yet. On launch day one commit switches both "main" below to barteron-nextgen.
# See LAUNCH.md, including how to roll back.
#
# The runner sits on the production server and the build runs code from npm packages, so:
# the job token can only read, it is not left in .git, and actions are pinned to a commit
# (a moved tag cannot change what runs here). build/workflows.test.ts keeps it that way.
name: barteron.club

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: barteron.club

jobs:
  build:
    # Manual runs too: only main may reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: mirror.barteron.club
    timeout-minutes: 30
    steps:
      - name: Checkout git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      # The copy of the current version is the rollback (LAUNCH.md). Old copies are removed by hand.
      - name: Keep the current version
        run: |
          backup="/data/barteron-old-$(date +%Y%m%d-%H%M%S)"
          cp -a /data/barteron "$backup"
          echo "Rollback: rsync -ah --delete $backup/ /data/barteron/"
      # No rm -rf: old chunks stay, so a page that is already open can still load its screens.
      - name: Copy
        run: rsync -ah ./dist/ /data/barteron/
